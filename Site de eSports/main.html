<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lusus</title>
    <link rel="stylesheet" href="../Site de eSports/styles/main.css">
</head>

<body>

    <header>
        <div class="logo"><img src="./images/ChatGPT Image 17 de ago. de 2026, 08_44_50.png" alt="Logo do Lusus"></div>
        <nav class="navegacao">
            <ul>
                <li><a href="../Site de esporte/stats.html">Estatísticas</a></li>
                <li><a href="../Site de esporte/highlights.html">Highlights</a></li>
                <li><a href="../Site de eSports/meta.html">Meta</a></li>
                <li><a href="../Site de eSports/builds.html">Builds e Configs</a></li>
            </ul>
        </nav>
    </header>

    <script>
        const botoes = document.querySelectorAll(".navegacao ul li a");

        botoes.forEach(function (botao) {

            botao.addEventListener("mouseenter", function () {
                botao.classList.add("ativo");
            });

            botao.addEventListener("mouseleave", function () {
                botao.classList.remove("ativo");
            });

        });
    </script>

    <main>
        <div class="noticias">
            <div class="vct">
                <iframe src="https://www.youtube.com/embed/TZcH-wkxS68"
                    title="VCT Americas Kickoff 2026 - Explicação do formato" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>

            <div class="major">
                <iframe></iframe>
            </div>

            <div class="lol">
                <iframe></iframe>
            </div>
        </div>

        <section class="times">
            <div class="furia">
                <a href="https://www.instagram.com/furiagg/?hl=pt-br"><img src="./images/Furia_Esports_logo.png"
                        alt="logo furia"></a>
            </div>

            <div class="vitality">
                <a href="https://www.instagram.com/teamvitality/"><img src="./images/Team_Vitality_2021_allmode.png"
                        alt="logo vitality"></a>
            </div>

            <div class="g2">
                <a href="https://www.instagram.com/g2esports/"><img src="./images/G2_Esports_logo.png"
                        alt="logo g2esports"></a>
            </div>

            <div class="navi">
                <a href="https://www.instagram.com/natus_vincere_official/"><img src="./images/Natus_Vincere_logo.png"
                        alt="logo navi"></a>
            </div>

            <div class="cloud9">
                <a href="https://www.instagram.com/cloud9gg/?hl=pt-br"><img src="./images/Cloud9_logo_c._2023.svg.webp"
                        alt="logo cloud9"></a>
            </div>

            <div class="nrg">
                <a href="https://www.instagram.com/nrggram/"><img src="./images/nrg-logo-png_seeklogo-531823.png"
                        alt="logo nrg"></a>
            </div>

            <div class="falcons">
                <a href="https://www.instagram.com/falconsesportsgg/"><img
                        src="./images/team-falcons-logo-png_seeklogo-556288.png" alt="logo falcons"></a>
            </div>

            <div class="liquid">
                <a href="https://www.instagram.com/teamliquidbr/?hl=pt-br"><img src="./images/Teamliquid_logo_blue.png"
                        alt="logo liquid"></a>
            </div>
        </section>

        <section class="placar">
            <div class="cs_major"></div>
            <div class="lol_worlds"></div>
            <div class="vct_americas"></div>
        </section>
    </main>

    <footer></footer>

</body>

</html>
